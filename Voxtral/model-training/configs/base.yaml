model:
  id: "voxtral-mini"
  use_dummy_model: false
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

data:
  train: "../../data/conversations_train.jsonl"
  val:   "../../data/conversations_val.jsonl"
  max_seq_len: 1024

training:
  epochs: 10
  batch_size: 4
  grad_accum: 4
  lr: 0.00002
  weight_decay: 0.01
  early_stopping_patience: 3
  output_dir: "./checkpoints"
  seed: 42