model:
  id: "music-flamingo"
  use_dummy_model: true
  lora:
    r: 4                   
    alpha: 8
    dropout: 0.0
    target_modules: ["q_proj", "v_proj"]

data:
  train: "../../data/sample_train.jsonl"
  val:   "../../data/sample_val.jsonl"
  max_seq_len: 128 

training:
  epochs: 3
  batch_size: 2
  grad_accum: 2 
  lr: 0.00002
  weight_decay: 0.01
  early_stopping_patience: 2
  output_dir: "./checkpoints"
  seed: 42